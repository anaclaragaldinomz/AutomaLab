<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutomaLab - Painel Integrado</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="painel">
    <header class="topo">
      <h1>AutomaLab</h1>
    </header>

    <nav class="abas">
      <button class="aba ativa" data-alvo="organizador">Organizador</button>
      <button class="aba" data-alvo="backup">Backup</button>
      <button class="aba" data-alvo="monitor">Monitor</button>
      <button class="aba" data-alvo="faxineiro">Faxineiro</button>
      <button class="aba" data-alvo="relatorios">Relatorios</button>
    </nav>

    <section class="modulo ativo" id="organizador">
      <form class="card">
        <h2>Organizador de Arquivos (Grupo 1)</h2>
        <label for="origem">Pasta de origem</label>
        <input type="text" id="origem" value="C:\AutomaLabTeste\origem">
        <label for="destino">Pasta de destino</label>
        <input type="text" id="destino" value="C:\AutomaLabTeste\organizado">
        <label for="modo">Arquivos sem categoria</label>
        <select id="modo">
          <option value="mover">Mover para "outros"</option>
          <option value="manter">Manter onde estao</option>
        </select>
        <label class="check"><input type="checkbox" id="simular" checked> Simular</label>
        <button type="button" class="btn-executar" data-modulo="organizador">Executar</button>
      </form>
      <pre id="log-organizador">Aguardando...</pre>
    </section>

    <section class="modulo" id="backup">
      <form class="card">
        <h2>Backup Automatizado (Grupo 1)</h2>
        <label for="origem">Pasta de origem</label>
        <input type="text" id="origem" value="C:\AutomaLabTeste\origem">
        <label for="destino">Pasta de backup</label>
        <input type="text" id="destino" value="C:\AutomaLabTeste\backup">
        <label for="extensoes">Extensoes (separadas por virgula, vazio = todas)</label>
        <input type="text" id="extensoes" value=".txt,.pdf,.jpg">
        <label class="check"><input type="checkbox" id="simular" checked> Simular</label>
        <button type="button" class="btn-executar" data-modulo="backup">Executar</button>
      </form>
      <pre id="log-backup">Aguardando...</pre>
    </section>

    <section class="modulo" id="monitor">
      <form class="card">
        <h2>Monitor do Sistema (Grupo 2)</h2>
        <label for="disco">Disco a analisar</label>
        <input type="text" id="disco" value="C:\">
        <button type="button" class="btn-executar" data-modulo="monitor">Executar</button>
      </form>
      <pre id="log-monitor">Aguardando...</pre>
    </section>

    <section class="modulo" id="faxineiro">
      <form class="card">
        <h2>Faxineiro Digital (Grupo 2)</h2>
        <label for="pasta">Pasta para limpar</label>
        <input type="text" id="pasta" value="C:\AutomaLabTeste\temporarios">
        <label for="dias">Apagar arquivos mais antigos que (dias)</label>
        <input type="number" id="dias" value="30">
        <label for="extensoes">Extensoes (vazio = todas)</label>
        <input type="text" id="extensoes" value=".tmp,.log">
        <label class="check"><input type="checkbox" id="simular" checked> Simular</label>
        <button type="button" class="btn-executar" data-modulo="faxineiro">Executar</button>
      </form>
      <pre id="log-faxineiro">Aguardando...</pre>
    </section>

    <section class="modulo" id="relatorios">
      <form class="card">
        <h2>Central de Relatorios (Grupo 3)</h2>
        <label for="saida">Salvar relatorio em (opcional)</label>
        <input type="text" id="saida" value="C:\AutomaLabTeste\relatorio_consolidado.txt">
        <button type="button" class="btn-executar" data-modulo="relatorios">Executar</button>
      </form>
      <pre id="log-relatorios">Aguardando...</pre>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
